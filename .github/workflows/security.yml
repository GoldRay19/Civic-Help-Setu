name: Security checks

# Secret scan, dependency audit and unsafe-pattern lint.
# How to run each one locally, and how to handle false positives: docs/SECURITY_CHECKS.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # New advisories show up without any code change, so re-check weekly (Mon 03:30 UTC)
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the checksums file of the same release
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the commit range can be scanned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Scan commits for secrets
        # The SHAs go through env, not straight into the script.
        # --redact masks the matched value in everything gitleaks prints.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="--all"
          fi
          echo "Scanning commit range: $range"
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="$range"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Possible secret committed::See docs/SECURITY_CHECKS.md (Secrets) for what to do. The value is not printed. Treat it as leaked and rotate it, removing it from the latest commit is not enough."
          fi
          exit "$status"

  dependencies:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # npm audit reads package-lock.json, so no install is needed.
      - name: Production dependencies (fails on high or critical)
        run: node scripts/security/audit-report.mjs --omit-dev --level high

      - name: All dependencies incl. dev tooling (report only)
        run: node scripts/security/audit-report.mjs --level high --warn-only

  unsafe-patterns:
    name: Unsafe DOM/HTML patterns (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint for unsafe patterns
        run: npm run lint:security
